
<ion-header>
  <ion-toolbar color="primary">

    <ion-buttons slot="start">
      <ion-button fill="clear" class="back-btn" (click)="goBack()">
        <ion-icon
          slot="icon-only"
          name="arrow-back-outline">
        </ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title>Room Management</ion-title>

  </ion-toolbar>
</ion-header>

<div class="tt">
  <h2>Room Management</h2>
</div>

<!-- ADD ROOM BUTTON -->
<ion-button expand="block" (click)="openModal()">

  <ion-icon
    slot="start"
    name="add-circle-outline">
  </ion-icon>

  Add Room

</ion-button>

<br />

<!-- ADD ROOM MODAL -->
<ion-modal [isOpen]="isModalOpen">

  <ng-template>

    <ion-header>
      <ion-toolbar color="primary">

        <ion-title>Add Room</ion-title>

        <ion-buttons slot="end">
          <ion-button (click)="closeModal()">
            Close
          </ion-button>
        </ion-buttons>

      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">

      <ion-card>
        <ion-card-content>

          <!-- ROOM NUMBER -->
          <ion-item>
            <ion-label position="stacked">
              Room Number
            </ion-label>

            <ion-input
              [(ngModel)]="room.roomNo"
              placeholder="Enter room number">
            </ion-input>
          </ion-item>

          <!-- FLOOR -->
          <ion-item>
            <ion-label position="stacked">
              Floor
            </ion-label>

            <ion-input
              type="number"
              min="1"
              [(ngModel)]="room.floor">
            </ion-input>
          </ion-item>

          <!-- RENT -->
          <ion-item>
            <ion-label position="stacked">
              Rent
            </ion-label>

            <ion-input
              type="number"
              min="0"
              [(ngModel)]="room.rent">
            </ion-input>
          </ion-item>

          <!-- SUBMIT -->
          <ion-button
            expand="block"
            (click)="addRoom()">

            <ion-icon
              slot="start"
              name="add-circle-outline">
            </ion-icon>

            Add Room

          </ion-button>

        </ion-card-content>
      </ion-card>

    </ion-content>

  </ng-template>

</ion-modal>

<!-- ROOM LIST -->
<ion-content>

  <ion-list>

    <!-- FLOOR GROUPS -->
    <div *ngFor="let group of groupedFloors">

      <!-- FLOOR HEADING -->
      <div class="floor-heading">

        <h2>
          Floor {{ group.floor }}
        </h2>

        <span>
          {{ group.rooms.length }} Rooms
        </span>

      </div>

      <!-- ROOMS -->
      <ion-card *ngFor="let r of group.rooms">

        <ion-card-content>

          <ion-grid>

            <ion-row>

              <!-- ROOM DETAILS -->
              <ion-col size="8">

                <h2>
                  Room {{ r.roomNo }}
                </h2>

                <p>
                  Floor: {{ r.floor }}
                </p>

                <p>
                  Rent: ₹{{ r.rent }}
                </p>

                <p>
                  Property: {{ r.propertyId?.name }}
                </p>

              </ion-col>

              <!-- ACTION BUTTONS -->
              <ion-col
                size="4"
                class="ion-text-end action-buttons">

                <!-- TENANT BUTTON -->
                <!--
                <ion-button
                  color="primary"
                  fill="clear"
                  (click)="goToTenant(r)">

                  <ion-icon name="add-circle-outline"></ion-icon>

                </ion-button>
                -->

                <!-- EDIT BUTTON -->
                <ion-button
                  color="success"
                  fill="clear"
                  (click)="openModal()">

                  <ion-icon name="create-outline"></ion-icon>

                </ion-button>

                <!-- DELETE BUTTON -->
                <ion-button
                  color="danger"
                  fill="clear"
                  (click)="deleteRoom(r._id)">

                  <ion-icon name="trash-outline"></ion-icon>

                </ion-button>

              </ion-col>

            </ion-row>

          </ion-grid>

        </ion-card-content>

      </ion-card>

    </div>

    <!-- EMPTY STATE -->
    <div
      *ngIf="rooms.length === 0"
      class="ion-text-center ion-padding">

      <h3>No Rooms Found</h3>

      <p>Add rooms to this property.</p>

    </div>

  </ion-list>

</ion-content>

<ion-header>
  <ion-toolbar class="blue-navbar">
    <ion-buttons slot="start">
      <ion-button fill="clear" class="back-btn" (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back-outline"> </ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title>Tenant Members</ion-title>

    <!-- <ion-buttons slot="end">
      <ion-button (click)="openAddModal()">
        <ion-icon slot="icon-only" name="add-outline"></ion-icon>
      </ion-button>
    </ion-buttons> -->
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Loading -->
  <div class="loading" *ngIf="isLoading">
    <ion-spinner></ion-spinner>
  </div>
  <div class="h11">
    <h2>Members</h2>
  </div>
  <!-- Empty -->
  <div class="empty-state" *ngIf="!isLoading">
    <!-- <ion-icon name="people-outline"></ion-icon>

    <h2>No Members</h2>

    <p>No members have been added to this tenant.</p> -->

    <ion-button (click)="openAddModal()">
      <ion-icon slot="start" name="add-circle-outline"></ion-icon>
      Add Member
    </ion-button>
  </div>
<br />
<br />
<br />
  <!-- Members -->
  <ion-list *ngIf="!isLoading && members.length > 0">
    <ion-card *ngFor="let member of members">
      <ion-card-header>
        <div class="member-header">
          <div >
            <ion-card-title>
              {{ member.memberName }}
            </ion-card-title>

            <ion-text color="medium">
              <p>
                {{ member.phone || "No phone number" }}
              </p>
            </ion-text>
          </div>

          <div class="actions">
            <ion-button fill="clear" (click)="openEditModal(member)">
              <ion-icon slot="icon-only" name="create-outline"></ion-icon>
            </ion-button>

            <ion-button
              fill="clear"
              color="danger"
              (click)="deleteMember(member)"
            >
              <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
            </ion-button>
          </div>
        </div>
      </ion-card-header>
    </ion-card>
  </ion-list>

  <!-- Add/Edit Modal -->
  <ion-modal [isOpen]="isModalOpen" (didDismiss)="closeModal()">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>
            {{ editingId ? "Edit Member" : "Add Member" }}
          </ion-title>

          <ion-buttons slot="end">
            <ion-button (click)="closeModal()"> Close </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">
        <ion-item>
          <ion-label position="stacked"> Member Name </ion-label>

          <ion-input
            [(ngModel)]="memberName"
            placeholder="Enter member name"
            type="text"
          ></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked"> Phone Number </ion-label>

          <ion-input
            [(ngModel)]="phone"
            placeholder="Enter phone number"
            type="tel"
            maxlength="10"
          ></ion-input>
        </ion-item>

        <ion-button expand="block" class="save-btn" (click)="saveMember()">
          {{ editingId ? "Update Member" : "Add Member" }}
        </ion-button>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
